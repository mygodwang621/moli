name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Unzip project files
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip
        unzip -o molijiang.zip -d . || true
        ls -la
    
    - name: Install dependencies
      run: |
        sudo apt-get install -y python3-pip build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good openjdk-17-jdk libtool libtool-bin autoconf automake pkg-config libffi-dev
        pip install buildozer==1.5.0 cython==0.29.37 python-for-android==2024.1.21

    - name: Build APK
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        ACLOCAL_PATH: /usr/share/aclocal
      run: |
        # Ubuntu 24.04 libffi fix: copy libtool m4 macros to aclocal path
        sudo find /usr -name "libtool.m4" -exec cp {} /usr/share/aclocal/ \; 2>/dev/null || true
        sudo find /usr -name "lt*.m4" -exec cp {} /usr/share/aclocal/ \; 2>/dev/null || true
        ls /usr/share/aclocal/lt*.m4 2>/dev/null || echo "no lt m4 files found"
        yes | buildozer android debug 2>&1 | tee build.log || true
        if [ ! -f bin/*.apk ]; then
          echo "=== Build failed, check log ==="
          tail -80 build.log
          exit 1
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: molijiang-apk
        path: bin/*.apk

name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk libtool autoconf automake pkg-config
        pip install buildozer==1.5.0 cython==0.29.37 python-for-android==2024.1.21

    - name: Patch p4a manifest template
      run: |
        # 找到 p4a 的 AndroidManifest 模板并注入 cutout 全屏支持
        TEMPLATE=$(python -c "import pythonforandroid,os; print(os.path.join(os.path.dirname(pythonforandroid.__file__), 'bootstraps', 'sdl2', 'build', 'templates', 'AndroidManifest.tmpl.xml'))")
        echo "Template path: $TEMPLATE"
        if [ -f "$TEMPLATE" ]; then
          # 先查看模板中 activity 的写法
          grep -n "android:name.*PythonActivity\|android:name.*activity" "$TEMPLATE" | head -5 || true
          # 尝试多种匹配方式注入 cutout 属性
          sed -i 's|android:name="org.kivy.android.PythonActivity"|android:name="org.kivy.android.PythonActivity"\n          android:windowLayoutInDisplayCutoutMode="shortEdges"|' "$TEMPLATE" || true
          sed -i 's|android:name="{{ args.activity }}"|android:name="{{ args.activity }}"\n          android:windowLayoutInDisplayCutoutMode="shortEdges"|' "$TEMPLATE" || true
          echo "Patch attempted. Verification:"
          grep -A2 "windowLayoutInDisplayCutoutMode" "$TEMPLATE" || echo "Cutout not found in template"
        else
          echo "Template not found at $TEMPLATE"
        fi

    - name: Build APK
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      run: |
        yes | buildozer android debug 2>&1 | tee build.log || true
        # 如果正常构建失败，检查是否是许可证问题
        if [ ! -f bin/*.apk ]; then
          echo "=== Build failed, check log ==="
          tail -50 build.log
          exit 1
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: molijiang-apk
        path: bin/*.apk


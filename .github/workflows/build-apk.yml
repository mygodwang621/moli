name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip build-essential git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev openjdk-17-jdk libtool autoconf automake pkg-config
        pip install buildozer==1.5.0 cython==0.29.37 python-for-android==2024.1.21

    - name: Build APK
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      run: |
        yes | buildozer android debug 2>&1 | tee build.log || true
        # 如果正常构建失败，检查是否是许可证问题
        if [ ! -f bin/*.apk ]; then
          echo "=== Build failed, check log ==="
          tail -50 build.log
          exit 1
        fi
    
    - name: Post-patch APK manifest for fullscreen
      run: |
        # 找到 buildozer 生成的 AndroidManifest 并注入 cutout 全屏支持
        MANIFEST=$(find .buildozer -name "AndroidManifest.xml" -path "*/build/*" | head -1)
        if [ -f "$MANIFEST" ]; then
          echo "Found manifest: $MANIFEST"
          sed -i 's|android:name="org.kivy.android.PythonActivity"|android:name="org.kivy.android.PythonActivity"\n          android:windowLayoutInDisplayCutoutMode="shortEdges"|' "$MANIFEST" || true
          grep -A2 "windowLayoutInDisplayCutoutMode" "$MANIFEST" || echo "Cutout not found"
        else
          echo "No generated manifest found"
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: molijiang-apk
        path: bin/*.apk

